# Development settings only: the extension is not a Python package. Its
# backend and launcher run on Hanafubuki's managed Python 3.11+.
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend", "launcher", "scripts", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["main", "home", "known", "layout", "node_release", "plans", "remote", "spec", "launch", "tests"]
known-third-party = ["hanafubuki_extension", "sd_webui_all_in_one", "sd_webui_all_in_one_hotpatcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The SDK and sd_webui_all_in_one come with Hanafubuki: pass them as
# `--extra-search-path` (README, Development).
[tool.ty.environment]
extra-paths = ["backend", "launcher", "scripts"]
